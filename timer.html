<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .routine-manager {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .routine-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .routine-controls input {
            flex: 1;
            min-width: 150px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .routine-controls button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .routine-controls button:hover {
            background: #5568d3;
        }

        .saved-routines {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .routine-chip {
            padding: 8px 15px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .routine-chip:hover {
            background: #667eea;
            color: white;
        }

        .routine-chip .delete {
            color: #dc3545;
            font-weight: bold;
            margin-left: 5px;
        }

        .routine-chip:hover .delete {
            color: white;
        }

        .intervals-section {
            margin-bottom: 30px;
        }

        .add-interval {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .add-interval input {
            width: 80px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
        }

        .add-interval button {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .add-interval button:hover {
            background: #218838;
        }

        .intervals-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .interval-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .interval-item.active {
            background: #667eea;
            color: white;
            font-weight: bold;
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .interval-item .time {
            font-size: 18px;
            font-weight: 600;
        }

        .interval-item button {
            padding: 5px 15px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .interval-item button:hover {
            background: #c82333;
        }

        .interval-item.active button {
            background: rgba(255, 255, 255, 0.3);
        }

        .interval-item.active button:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .timer-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .progress-text {
            font-size: 16px;
            color: #666;
            margin-bottom: 10px;
        }

        .countdown {
            font-size: 72px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
        }

        .countdown.warning {
            color: #ff6b6b;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .controls button {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            min-width: 140px;
        }

        .btn-start {
            background: #28a745;
            color: white;
        }

        .btn-start:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
        }

        .btn-pause {
            background: #ffc107;
            color: #333;
        }

        .btn-pause:hover {
            background: #e0a800;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.4);
        }

        .btn-stop {
            background: #dc3545;
            color: white;
        }

        .btn-stop:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.4);
        }

        .btn-skip {
            background: #6c757d;
            color: white;
        }

        .btn-skip:hover {
            background: #5a6268;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(108, 117, 125, 0.4);
        }

        .controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 18px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            .countdown {
                font-size: 56px;
            }

            .controls button {
                padding: 12px 30px;
                font-size: 16px;
                min-width: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Exercise Timer</h1>

        <div class="routine-manager">
            <div class="routine-controls">
                <input type="text" id="routineName" placeholder="Routine name...">
                <button onclick="saveRoutine()">Save Routine</button>
            </div>
            <div id="savedRoutines" class="saved-routines"></div>
        </div>

        <div class="intervals-section">
            <div class="add-interval">
                <label>Minutes:</label>
                <input type="number" id="minutes" min="0" value="1">
                <label>Seconds:</label>
                <input type="number" id="seconds" min="0" max="59" value="0">
                <button onclick="addInterval()">Add Interval</button>
            </div>

            <div id="intervalsList" class="intervals-list"></div>
        </div>

        <div class="timer-display">
            <div id="progressText" class="progress-text"></div>
            <div id="countdown" class="countdown">00:00</div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn-start" onclick="startTimer()">Start</button>
            <button id="pauseBtn" class="btn-pause" onclick="pauseTimer()" disabled>Pause</button>
            <button id="skipBtn" class="btn-skip" onclick="skipInterval()" disabled>Skip</button>
            <button id="stopBtn" class="btn-stop" onclick="stopTimer()" disabled>Stop</button>
        </div>
    </div>

    <script>
        let intervals = [];
        let currentIntervalIndex = -1;
        let remainingSeconds = 0;
        let timerInterval = null;
        let isPaused = false;
        let audioContext = null;

        // Initialize
        loadIntervals();
        loadSavedRoutines();
        updateDisplay();

        function addInterval() {
            const minutes = parseInt(document.getElementById('minutes').value) || 0;
            const seconds = parseInt(document.getElementById('seconds').value) || 0;
            const totalSeconds = minutes * 60 + seconds;

            if (totalSeconds > 0) {
                intervals.push(totalSeconds);
                saveIntervals();
                renderIntervals();
                updateDisplay();
            }
        }

        function removeInterval(index) {
            intervals.splice(index, 1);
            saveIntervals();
            renderIntervals();
            updateDisplay();
        }

        function renderIntervals() {
            const list = document.getElementById('intervalsList');

            if (intervals.length === 0) {
                list.innerHTML = '<div class="empty-state">No intervals added yet. Add your first interval above!</div>';
                return;
            }

            list.innerHTML = intervals.map((seconds, index) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                const timeStr = `${mins}:${secs.toString().padStart(2, '0')}`;
                const isActive = index === currentIntervalIndex;

                return `
                    <div class="interval-item ${isActive ? 'active' : ''}">
                        <span class="time">${index + 1}. ${timeStr}</span>
                        <button onclick="removeInterval(${index})" ${timerInterval ? 'disabled' : ''}>Remove</button>
                    </div>
                `;
            }).join('');
        }

        function startTimer() {
            if (intervals.length === 0) {
                alert('Please add at least one interval first!');
                return;
            }

            // Prevent starting multiple timers
            if (timerInterval !== null) {
                return;
            }

            if (currentIntervalIndex === -1) {
                currentIntervalIndex = 0;
                remainingSeconds = intervals[0];
            }

            isPaused = false;
            renderIntervals();

            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateDisplay();

                if (remainingSeconds <= 0) {
                    playBell();
                    currentIntervalIndex++;

                    if (currentIntervalIndex < intervals.length) {
                        remainingSeconds = intervals[currentIntervalIndex];
                        renderIntervals();
                        updateButtons(); // Update button states when moving to next interval
                    } else {
                        stopTimer();
                    }
                }
            }, 1000);

            // Update buttons AFTER timerInterval is set
            updateButtons();
        }

        function pauseTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                isPaused = true;
                updateButtons();
            }
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            currentIntervalIndex = -1;
            remainingSeconds = 0;
            isPaused = false;
            updateDisplay();
            updateButtons();
            renderIntervals();
        }

        function skipInterval() {
            if (currentIntervalIndex < intervals.length - 1) {
                currentIntervalIndex++;
                remainingSeconds = intervals[currentIntervalIndex];
                renderIntervals();
                updateDisplay();
            } else {
                stopTimer();
            }
        }

        function updateDisplay() {
            const countdown = document.getElementById('countdown');
            const progressText = document.getElementById('progressText');

            if (currentIntervalIndex >= 0 && currentIntervalIndex < intervals.length) {
                const mins = Math.floor(remainingSeconds / 60);
                const secs = remainingSeconds % 60;
                countdown.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                progressText.textContent = `Interval ${currentIntervalIndex + 1} of ${intervals.length}`;

                if (remainingSeconds <= 10 && remainingSeconds > 0) {
                    countdown.classList.add('warning');
                } else {
                    countdown.classList.remove('warning');
                }
            } else {
                countdown.textContent = '00:00';
                progressText.textContent = intervals.length > 0 ? 'Ready to start' : '';
                countdown.classList.remove('warning');
            }
        }

        function updateButtons() {
            const startBtn = document.getElementById('startBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const stopBtn = document.getElementById('stopBtn');
            const skipBtn = document.getElementById('skipBtn');

            const isRunning = timerInterval !== null;
            const hasIntervals = intervals.length > 0;

            startBtn.disabled = isRunning;
            pauseBtn.disabled = !isRunning;
            stopBtn.disabled = currentIntervalIndex === -1;
            skipBtn.disabled = !isRunning;

            if (isPaused) {
                startBtn.textContent = 'Resume';
            } else {
                startBtn.textContent = 'Start';
            }
        }

        function playBell() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            const now = audioContext.currentTime;

            // Create a soft, gentle chime using lower frequencies and volume
            const frequencies = [440, 554.37]; // A4 and C#5 - a pleasant musical interval

            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = freq;
                oscillator.type = 'sine';

                // Softer volume with gentle fade in and out
                gainNode.gain.setValueAtTime(0, now + index * 0.08);
                gainNode.gain.linearRampToValueAtTime(0.08, now + index * 0.08 + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

                oscillator.start(now + index * 0.08);
                oscillator.stop(now + 0.8);
            });
        }

        function saveIntervals() {
            localStorage.setItem('currentIntervals', JSON.stringify(intervals));
        }

        function loadIntervals() {
            const saved = localStorage.getItem('currentIntervals');
            if (saved) {
                intervals = JSON.parse(saved);
                renderIntervals();
            }
        }

        function saveRoutine() {
            const name = document.getElementById('routineName').value.trim();
            if (!name) {
                alert('Please enter a routine name');
                return;
            }

            if (intervals.length === 0) {
                alert('Please add at least one interval first');
                return;
            }

            const routines = getSavedRoutines();
            routines[name] = intervals.slice();
            localStorage.setItem('savedRoutines', JSON.stringify(routines));

            document.getElementById('routineName').value = '';
            loadSavedRoutines();
        }

        function loadRoutine(name) {
            const routines = getSavedRoutines();
            if (routines[name]) {
                intervals = routines[name].slice();
                saveIntervals();
                renderIntervals();
                updateDisplay();
            }
        }

        function deleteRoutine(name, event) {
            event.stopPropagation();
            if (confirm(`Delete routine "${name}"?`)) {
                const routines = getSavedRoutines();
                delete routines[name];
                localStorage.setItem('savedRoutines', JSON.stringify(routines));
                loadSavedRoutines();
            }
        }

        function getSavedRoutines() {
            const saved = localStorage.getItem('savedRoutines');
            return saved ? JSON.parse(saved) : {};
        }

        function loadSavedRoutines() {
            const routines = getSavedRoutines();
            const container = document.getElementById('savedRoutines');

            const routineNames = Object.keys(routines);
            if (routineNames.length === 0) {
                container.innerHTML = '<div style="color: #999; font-size: 14px;">No saved routines yet</div>';
                return;
            }

            container.innerHTML = routineNames.map(name => `
                <div class="routine-chip" onclick="loadRoutine('${name}')">
                    ${name}
                    <span class="delete" onclick="deleteRoutine('${name}', event)">×</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
