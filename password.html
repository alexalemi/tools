<!DOCTYPE html>
</html>
<head>
<title>Passwords</title>
<style>
html {
  max-width: 70ch;
  padding: 3em 1em;
  margin: auto;
  line-height: 1.75;
  font-size: 1.25em;
}

.pass {
  font-family: monospace;
  font-size: 1.5em;
}

#password {
}
</style>
</head>
<body>

  <script type="text/javascript">
      const lowercase = "abcdefghijkmnpqrstuvwxyz";
      const uppercase = "ABCDEFGHJKLMNPQRSTUVWXYZ";
      const numbers = "23456789";
      const symbols = "*!-@%#.$_&";
      const all = lowercase + uppercase + numbers + symbols;


      function choice(s) {
        const id = Math.floor(Math.random() * s.length);
        return s[id];
      }

      function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
      }

      function invalid(passwordArray) {
        const pass = passwordArray.join("");
        return pass.includes('--') || pass.includes("__");
      }

      function generate() {
        // Generate a 15 character password.

        let password = new Array(15);
        // first ensure there is at least 1 of each class.
        password[0] = choice(lowercase);
        password[1] = choice(uppercase);
        password[2] = choice(numbers);
        password[3] = choice(symbols);

        for (let i = 4; i < 15; i++) {
          password[i] = choice(all);
        }

        shuffle(password);

        while (invalid(password)) {
          shuffle(password);
        }

        return password.join("");
      }
  </script>


	<h1>Passwords</h1>
	<p>Have you ever wanted to use Chrome's built-in password generator but found yourself on a form
  for which it doesn't seem to work? Just use one of the following passwords generated with what ought to be the same algorithm.</p>

  <div id="password">
  </div>
	<p>That is all.</p>

  <script type="text/javascript">
      let passwordDiv = document.getElementById("password");
      for (let i = 0; i < 6; i++) {
        let element = document.createElement("p");
        element.textContent = generate();
        element.classList.add("pass");
        passwordDiv.appendChild(element);
      }
  </script>
</body>
</html>
