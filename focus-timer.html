<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Focus Timer</title>
  <style>
    html {
      max-width: 70ch;
      padding: 3em 1em;
      margin: auto;
      line-height: 1.75;
      font-size: 1.25em;
    }

    h1 {
      margin-bottom: 0.5em;
    }

    .clock-container {
      display: flex;
      justify-content: center;
      margin: 2em 0;
    }

    svg#clock {
      width: 300px;
      height: 300px;
    }

    .clock-face {
      fill: none;
      stroke: #333;
      stroke-width: 2;
    }

    .tick {
      stroke: #333;
      stroke-width: 1;
    }

    .tick-major {
      stroke-width: 2;
    }

    .hand {
      stroke: #333;
      stroke-linecap: round;
    }

    .hand-hour {
      stroke-width: 4;
    }

    .hand-minute {
      stroke-width: 3;
    }

    .hand-second {
      stroke-width: 1;
      stroke: #666;
    }

    .center-dot {
      fill: #333;
    }

    .timer-arc {
      fill: rgba(200, 60, 60, 0.35);
      stroke: none;
    }

    .controls {
      margin: 1.5em 0;
    }

    .input-row {
      display: flex;
      gap: 1em;
      align-items: center;
      margin-bottom: 1em;
      flex-wrap: wrap;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 0.5em;
    }

    input[type="number"],
    input[type="time"] {
      font-size: 1em;
      padding: 0.3em 0.5em;
      border: 1px solid #333;
      width: 5em;
    }

    input[type="time"] {
      width: 7em;
    }

    .mode-toggle {
      display: flex;
      gap: 0.5em;
      margin-bottom: 1em;
    }

    .mode-toggle label {
      cursor: pointer;
    }

    .mode-toggle input[type="radio"] {
      margin-right: 0.25em;
    }

    .buttons {
      display: flex;
      gap: 0.5em;
      flex-wrap: wrap;
    }

    button {
      font-size: 1em;
      padding: 0.4em 1em;
      cursor: pointer;
      border: 1px solid #333;
      background: white;
    }

    button:hover {
      background: #f0f0f0;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 1em;
      font-family: monospace;
      font-size: 1.1em;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>Deep Focus Timer</h1>
  <p>Set a duration or target time. The red area shows your remaining focus time.</p>

  <div class="clock-container">
    <svg id="clock" viewBox="0 0 200 200">
      <!-- Clock face -->
      <circle class="clock-face" cx="100" cy="100" r="95" />

      <!-- Hour ticks (generated by JS) -->
      <g id="ticks"></g>

      <!-- Timer arc/spiral (drawn by JS) -->
      <path id="timer-arc" class="timer-arc" d="" />

      <!-- Clock hands -->
      <line id="hand-hour" class="hand hand-hour" x1="100" y1="100" x2="100" y2="55" />
      <line id="hand-minute" class="hand hand-minute" x1="100" y1="100" x2="100" y2="30" />
      <line id="hand-second" class="hand hand-second" x1="100" y1="100" x2="100" y2="25" />

      <!-- Center dot -->
      <circle class="center-dot" cx="100" cy="100" r="4" />
    </svg>
  </div>

  <div class="controls">
    <div class="mode-toggle">
      <label>
        <input type="radio" name="mode" value="duration" checked />
        Duration
      </label>
      <label>
        <input type="radio" name="mode" value="target" />
        Target time
      </label>
    </div>

    <div class="input-row">
      <div class="input-group" id="duration-input">
        <input type="number" id="minutes" min="1" max="480" value="25" />
        <span>minutes</span>
      </div>
      <div class="input-group hidden" id="target-input">
        <input type="time" id="target-time" />
      </div>
    </div>

    <div class="buttons">
      <button id="btn-start">Start</button>
      <button id="btn-pause" disabled>Pause</button>
      <button id="btn-reset" disabled>Reset</button>
    </div>
  </div>

  <div class="status" id="status"></div>

  <script>
    // ============ State ============
    let timerState = 'idle'; // idle, running, paused, completed
    let endTime = null;      // Date object for when timer ends
    let totalDuration = 0;   // Total duration in milliseconds
    let pausedRemaining = 0; // Remaining ms when paused
    let tickInterval = null;
    let audioContext = null;

    // ============ DOM Elements ============
    const clock = document.getElementById('clock');
    const timerArc = document.getElementById('timer-arc');
    const handHour = document.getElementById('hand-hour');
    const handMinute = document.getElementById('hand-minute');
    const handSecond = document.getElementById('hand-second');
    const statusEl = document.getElementById('status');
    const btnStart = document.getElementById('btn-start');
    const btnPause = document.getElementById('btn-pause');
    const btnReset = document.getElementById('btn-reset');
    const minutesInput = document.getElementById('minutes');
    const targetTimeInput = document.getElementById('target-time');
    const durationInputGroup = document.getElementById('duration-input');
    const targetInputGroup = document.getElementById('target-input');
    const modeRadios = document.querySelectorAll('input[name="mode"]');

    // ============ Initialize ============
    function init() {
      drawTicks();
      updateClock();
      setDefaultTargetTime();

      // Start the clock ticking
      tickInterval = setInterval(tick, 1000);

      // Event listeners
      modeRadios.forEach(radio => {
        radio.addEventListener('change', handleModeChange);
      });
      btnStart.addEventListener('click', startTimer);
      btnPause.addEventListener('click', togglePause);
      btnReset.addEventListener('click', resetTimer);
    }

    function drawTicks() {
      const ticksGroup = document.getElementById('ticks');
      for (let i = 0; i < 12; i++) {
        const angle = (i * 30 - 90) * Math.PI / 180;
        const isMajor = i % 3 === 0;
        const innerR = isMajor ? 82 : 85;
        const outerR = 92;

        const x1 = 100 + innerR * Math.cos(angle);
        const y1 = 100 + innerR * Math.sin(angle);
        const x2 = 100 + outerR * Math.cos(angle);
        const y2 = 100 + outerR * Math.sin(angle);

        const tick = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        tick.setAttribute('x1', x1);
        tick.setAttribute('y1', y1);
        tick.setAttribute('x2', x2);
        tick.setAttribute('y2', y2);
        tick.setAttribute('class', `tick ${isMajor ? 'tick-major' : ''}`);
        ticksGroup.appendChild(tick);
      }
    }

    function setDefaultTargetTime() {
      const now = new Date();
      now.setMinutes(now.getMinutes() + 25);
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      targetTimeInput.value = `${hours}:${mins}`;
    }

    // ============ Clock Hands ============
    function updateClock() {
      const now = new Date();
      const hours = now.getHours() % 12;
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();

      // Calculate angles (0 degrees = 12 o'clock)
      const hourAngle = (hours + minutes / 60) * 30;
      const minuteAngle = (minutes + seconds / 60) * 6;
      const secondAngle = seconds * 6;

      // Apply rotations
      handHour.setAttribute('transform', `rotate(${hourAngle}, 100, 100)`);
      handMinute.setAttribute('transform', `rotate(${minuteAngle}, 100, 100)`);
      handSecond.setAttribute('transform', `rotate(${secondAngle}, 100, 100)`);
    }

    // ============ Timer Arc/Spiral ============
    function updateTimerVisualization() {
      if (timerState === 'idle') {
        timerArc.setAttribute('d', '');
        return;
      }

      const now = new Date();
      const remaining = timerState === 'paused' ? pausedRemaining : endTime - now;

      if (remaining <= 0) {
        timerArc.setAttribute('d', '');
        return;
      }

      const remainingMinutes = remaining / 60000;
      const nowMinutes = now.getMinutes() + now.getSeconds() / 60;

      // Start angle: current minute position
      const startAngle = (nowMinutes / 60) * 360 - 90;

      if (remainingMinutes <= 60) {
        // Simple annulus arc
        drawAnnulus(startAngle, remainingMinutes);
      } else {
        // Spiral for > 1 hour
        drawSpiral(startAngle, remainingMinutes);
      }
    }

    function drawAnnulus(startAngleDeg, durationMinutes) {
      const cx = 100, cy = 100;
      const innerR = 35;
      const outerR = 78;

      const startAngle = startAngleDeg * Math.PI / 180;
      const sweepAngle = (durationMinutes / 60) * 2 * Math.PI;
      const endAngle = startAngle + sweepAngle;

      const largeArc = sweepAngle > Math.PI ? 1 : 0;

      // Outer arc start/end points
      const ox1 = cx + outerR * Math.cos(startAngle);
      const oy1 = cy + outerR * Math.sin(startAngle);
      const ox2 = cx + outerR * Math.cos(endAngle);
      const oy2 = cy + outerR * Math.sin(endAngle);

      // Inner arc start/end points
      const ix1 = cx + innerR * Math.cos(startAngle);
      const iy1 = cy + innerR * Math.sin(startAngle);
      const ix2 = cx + innerR * Math.cos(endAngle);
      const iy2 = cy + innerR * Math.sin(endAngle);

      // Path: outer arc, line to inner, inner arc (reverse), line back
      const d = `
        M ${ox1} ${oy1}
        A ${outerR} ${outerR} 0 ${largeArc} 1 ${ox2} ${oy2}
        L ${ix2} ${iy2}
        A ${innerR} ${innerR} 0 ${largeArc} 0 ${ix1} ${iy1}
        Z
      `;

      timerArc.setAttribute('d', d);
    }

    function drawSpiral(startAngleDeg, totalMinutes) {
      const cx = 100, cy = 100;
      const minRadius = 20;
      const maxRadius = 78;
      const totalHours = totalMinutes / 60;
      const ringWidth = (maxRadius - minRadius) / Math.ceil(totalHours);

      // Build spiral path with many small segments
      const segments = Math.ceil(totalMinutes * 2); // ~2 segments per minute
      const points = [];

      // Outer edge of spiral (going forward in time)
      for (let i = 0; i <= segments; i++) {
        const t = i / segments; // 0 to 1
        const minutesFromNow = t * totalMinutes;
        const angleDeg = startAngleDeg + (minutesFromNow / 60) * 360;
        const angleRad = angleDeg * Math.PI / 180;

        // Radius increases as we go further in time
        const hoursFromNow = minutesFromNow / 60;
        const r = minRadius + hoursFromNow * ringWidth + ringWidth * 0.8;

        points.push({
          x: cx + r * Math.cos(angleRad),
          y: cy + r * Math.sin(angleRad)
        });
      }

      // Inner edge of spiral (going backward in time)
      for (let i = segments; i >= 0; i--) {
        const t = i / segments;
        const minutesFromNow = t * totalMinutes;
        const angleDeg = startAngleDeg + (minutesFromNow / 60) * 360;
        const angleRad = angleDeg * Math.PI / 180;

        const hoursFromNow = minutesFromNow / 60;
        const r = minRadius + hoursFromNow * ringWidth;

        points.push({
          x: cx + r * Math.cos(angleRad),
          y: cy + r * Math.sin(angleRad)
        });
      }

      // Build path
      let d = `M ${points[0].x} ${points[0].y}`;
      for (let i = 1; i < points.length; i++) {
        d += ` L ${points[i].x} ${points[i].y}`;
      }
      d += ' Z';

      timerArc.setAttribute('d', d);
    }

    // ============ Timer Logic ============
    function tick() {
      updateClock();

      if (timerState === 'running') {
        updateTimerVisualization();
        updateStatus();

        const now = new Date();
        if (now >= endTime) {
          completeTimer();
        }
      } else if (timerState === 'paused') {
        updateTimerVisualization();
      }
    }

    function updateStatus() {
      if (timerState === 'idle') {
        statusEl.textContent = '';
        return;
      }

      let remaining;
      if (timerState === 'paused') {
        remaining = pausedRemaining;
      } else if (timerState === 'completed') {
        remaining = 0;
      } else {
        remaining = Math.max(0, endTime - new Date());
      }

      const totalSec = Math.ceil(remaining / 1000);
      const hours = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;

      let timeStr;
      if (hours > 0) {
        timeStr = `${hours}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      } else {
        timeStr = `${mins}:${String(secs).padStart(2, '0')}`;
      }

      const stateLabel = timerState === 'paused' ? ' (paused)' :
                         timerState === 'completed' ? ' — Complete!' : '';
      statusEl.textContent = `${timeStr} remaining${stateLabel}`;
    }

    function startTimer() {
      const mode = document.querySelector('input[name="mode"]:checked').value;
      let durationMs;

      if (mode === 'duration') {
        const minutes = parseInt(minutesInput.value, 10);
        if (isNaN(minutes) || minutes < 1) {
          alert('Please enter a valid number of minutes.');
          return;
        }
        durationMs = minutes * 60 * 1000;
      } else {
        const targetStr = targetTimeInput.value;
        if (!targetStr) {
          alert('Please enter a target time.');
          return;
        }
        const [hours, mins] = targetStr.split(':').map(Number);
        const target = new Date();
        target.setHours(hours, mins, 0, 0);

        // If target is in the past, assume tomorrow
        if (target <= new Date()) {
          target.setDate(target.getDate() + 1);
        }

        durationMs = target - new Date();
      }

      totalDuration = durationMs;
      endTime = new Date(Date.now() + durationMs);
      timerState = 'running';

      updateButtons();
      updateTimerVisualization();
      updateStatus();
    }

    function togglePause() {
      if (timerState === 'running') {
        pausedRemaining = endTime - new Date();
        timerState = 'paused';
        btnPause.textContent = 'Resume';
      } else if (timerState === 'paused') {
        endTime = new Date(Date.now() + pausedRemaining);
        timerState = 'running';
        btnPause.textContent = 'Pause';
      }
      updateButtons();
      updateStatus();
    }

    function resetTimer() {
      timerState = 'idle';
      endTime = null;
      pausedRemaining = 0;
      btnPause.textContent = 'Pause';

      updateButtons();
      updateTimerVisualization();
      updateStatus();
    }

    function completeTimer() {
      timerState = 'completed';
      updateButtons();
      updateStatus();
      updateTimerVisualization();
      playSingingBowl();
    }

    function updateButtons() {
      const isIdle = timerState === 'idle';
      const isRunning = timerState === 'running';
      const isPaused = timerState === 'paused';
      const isCompleted = timerState === 'completed';

      btnStart.disabled = !isIdle;
      btnPause.disabled = isIdle || isCompleted;
      btnReset.disabled = isIdle;

      // Disable inputs while timer is active
      minutesInput.disabled = !isIdle;
      targetTimeInput.disabled = !isIdle;
      modeRadios.forEach(r => r.disabled = !isIdle);
    }

    function handleModeChange(e) {
      const mode = e.target.value;
      if (mode === 'duration') {
        durationInputGroup.classList.remove('hidden');
        targetInputGroup.classList.add('hidden');
      } else {
        durationInputGroup.classList.add('hidden');
        targetInputGroup.classList.remove('hidden');
        setDefaultTargetTime();
      }
    }

    // ============ Singing Bowl Sound ============
    function playSingingBowl() {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();

      // Singing bowl frequencies (fundamental + partials)
      // Based on typical Tibetan singing bowl harmonics
      const fundamentalFreq = 220; // A3
      const partials = [
        { freq: fundamentalFreq, gain: 0.5 },
        { freq: fundamentalFreq * 2.0, gain: 0.3 },      // Octave
        { freq: fundamentalFreq * 3.0, gain: 0.15 },     // Fifth above octave
        { freq: fundamentalFreq * 4.2, gain: 0.1 },      // Slightly sharp double octave
        { freq: fundamentalFreq * 5.4, gain: 0.08 },     // Characteristic bowl partial
        { freq: fundamentalFreq * 6.8, gain: 0.05 },     // High shimmer
      ];

      const masterGain = audioContext.createGain();
      masterGain.gain.setValueAtTime(0.4, audioContext.currentTime);
      masterGain.gain.exponentialDecayTo = 0.001;
      masterGain.connect(audioContext.destination);

      const duration = 4; // seconds

      partials.forEach(({ freq, gain }) => {
        // Main oscillator
        const osc = audioContext.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioContext.currentTime);

        // Slight vibrato for warmth
        const vibrato = audioContext.createOscillator();
        const vibratoGain = audioContext.createGain();
        vibrato.frequency.setValueAtTime(5 + Math.random() * 2, audioContext.currentTime);
        vibratoGain.gain.setValueAtTime(freq * 0.003, audioContext.currentTime);
        vibrato.connect(vibratoGain);
        vibratoGain.connect(osc.frequency);

        // Envelope for this partial
        const envelope = audioContext.createGain();
        envelope.gain.setValueAtTime(0, audioContext.currentTime);
        envelope.gain.linearRampToValueAtTime(gain, audioContext.currentTime + 0.02);
        envelope.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);

        osc.connect(envelope);
        envelope.connect(masterGain);

        vibrato.start(audioContext.currentTime);
        osc.start(audioContext.currentTime);
        vibrato.stop(audioContext.currentTime + duration);
        osc.stop(audioContext.currentTime + duration);
      });

      // Add a subtle "strike" transient
      const noise = audioContext.createOscillator();
      noise.type = 'triangle';
      noise.frequency.setValueAtTime(fundamentalFreq * 8, audioContext.currentTime);

      const strikeEnv = audioContext.createGain();
      strikeEnv.gain.setValueAtTime(0.15, audioContext.currentTime);
      strikeEnv.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.1);

      noise.connect(strikeEnv);
      strikeEnv.connect(masterGain);
      noise.start(audioContext.currentTime);
      noise.stop(audioContext.currentTime + 0.1);
    }

    // ============ Start ============
    init();
  </script>
</body>
</html>
